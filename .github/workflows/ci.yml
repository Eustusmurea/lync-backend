name: CI

on:
  push:
    branches: [main, master, visits]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lyncare_test
          POSTGRES_USER: lyncare
          POSTGRES_PASSWORD: lyncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyncare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost
          DB_ENGINE: postgresql
          DB_NAME: lyncare_test
          DB_USER: lyncare
          DB_PASSWORD: lyncare
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py check --deploy
          python manage.py migrate --noinput
